[project]
name = "evals-gepa"
version = "0.1.0"
description = "CPSC 436C tutorial: course gateway, an Inspect eval, a GEPA prompt optimisation, the eval again on held-out cases"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.287",
    "gepa==0.1.4",
    "openai==3.42.1",
    "duckdb==2.0.0",
    "pytest>=8",
    "agent-client-protocol==0.12.1",  # inspect-ai 0.3.287 breaks with 1.0.0 (acp.helpers), the L15 lock has 0.12.1
    "dspy==3.5.0",
    "ipykernel==7.4.0",   # for tutorial.ipynb (VS Code or Jupyter: select the .venv kernel)
    "ipywidgets==8.1.9",  # inspect_ai needs it inside a notebook
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nbclient==0.11.0",  # tests/test_notebook.py runs tutorial.ipynb headless
]
